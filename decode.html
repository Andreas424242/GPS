<!doctype html>
<!--
  GPS Buddy encrypted trace decryptor stub (GitHub Pages).
  URL shape: ?blob=<URL-encoded https URL>#k=<base64url key>&iv=<base64url iv>
  Crypto:    AES-GCM-256, 12-byte IV, 16-byte auth tag (WebCrypto default tagLength=128).
  Blob:      ciphertext ‖ tag — iOS must strip CryptoKit's leading 12-byte nonce before upload;
             nonce is sent separately in the URL fragment as `iv`.
  CORS:      Blob is fetched directly. The Cloudflare Worker that serves the encrypted blob
             responds with Access-Control-Allow-Origin: *, so no proxy is needed. iOS sets
             ?blob= to the Worker's public read URL.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GPS trace</title>

<meta property="og:type" content="website">
<meta property="og:title" content="GPS trace">
<meta property="og:description" content="Encrypted location trace.">
<meta property="og:image" content="https://sputnik-export.onemansoftware.com/preview.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="GPS trace preview">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="GPS trace">
<meta name="twitter:description" content="Encrypted location trace.">
<meta name="twitter:image" content="https://sputnik-export.onemansoftware.com/preview.png">

<style>
  html, body, iframe {
    margin: 0; padding: 0; width: 100%; height: 100%; border: 0;
    background: #000508;
  }

  .status {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 28px;
    padding: 1.5rem; text-align: center;
    color: #00D4FF;
    font: 13px/1.5 'SF Mono', Menlo, Consolas, 'Courier New', monospace;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    overflow: hidden;
  }

  /* Sweep scanline that travels down the screen */
  .status::before {
    content: "";
    position: absolute;
    left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg,
      transparent 0%,
      rgba(0, 212, 255, 0.0) 10%,
      rgba(0, 212, 255, 0.85) 50%,
      rgba(0, 212, 255, 0.0) 90%,
      transparent 100%);
    box-shadow: 0 0 8px rgba(0, 212, 255, 0.6);
    animation: sweep 3.5s linear infinite;
    pointer-events: none;
  }
  @keyframes sweep {
    0%   { top: -2px; opacity: 0; }
    10%  { opacity: 1; }
    90%  { opacity: 1; }
    100% { top: 100%; opacity: 0; }
  }

  /* Faint horizontal scan-line texture across the whole screen */
  .status::after {
    content: "";
    position: absolute;
    inset: 0;
    background-image: repeating-linear-gradient(
      0deg,
      transparent 0px,
      transparent 2px,
      rgba(0, 212, 255, 0.04) 3px,
      rgba(0, 212, 255, 0.04) 4px
    );
    pointer-events: none;
  }

  .label {
    text-shadow:
      0 0 4px rgba(0, 212, 255, 0.7),
      0 0 16px rgba(0, 212, 255, 0.35);
    animation: flicker 4s steps(1, end) infinite;
    position: relative; z-index: 1;
  }

  /* Subtle CRT flicker — most frames at full opacity, a few dimmed */
  @keyframes flicker {
    0%, 7%, 14%, 21%, 28%, 35%, 42%, 49%, 56%, 63%, 70%, 77%, 84%, 91%, 98%, 100% { opacity: 1; }
    8%   { opacity: 0.65; }
    22%  { opacity: 0.55; }
    50%  { opacity: 0.7; }
    78%  { opacity: 0.5; }
  }

  /* Blinking cursor after the label */
  .cursor {
    display: inline-block;
    width: 0.6em; height: 1em;
    background: #00D4FF;
    margin-left: 4px;
    vertical-align: middle;
    box-shadow: 0 0 6px #00D4FF, 0 0 14px rgba(0, 212, 255, 0.5);
    animation: blink 1.0s steps(2, jump-none) infinite;
  }
  @keyframes blink {
    0%, 49%   { opacity: 1; }
    50%, 100% { opacity: 0; }
  }

  /* Tiny status hint below */
  .hint {
    font-size: 10px;
    letter-spacing: 0.25em;
    color: rgba(0, 212, 255, 0.5);
    text-shadow: 0 0 4px rgba(0, 212, 255, 0.3);
    position: relative; z-index: 1;
  }

  @media (prefers-reduced-motion: reduce) {
    .status::before, .label, .cursor { animation: none; }
    .status::before { display: none; }
    .cursor { opacity: 1; }
  }
</style>
</head>
<body>
<div id="status" class="status">
  <span class="label">Decrypting trace<span class="cursor"></span></span>
  <span class="hint">AES-GCM-256 · End-to-end encrypted</span>
</div>
<script type="module">
(async () => {
  const showError = (err) => {
    const map = {
      INCOMPLETE_LINK: "This link is incomplete. Please ask the sender to share it again.",
      EXPIRED:         "This trace has expired. Encrypted traces are only available for 24 hours.",
      DECRYPT_FAILED:  "This trace could not be decrypted. The link may be corrupt.",
      NETWORK:         "Could not load the trace. Check your connection and try again.",
    };
    const msg = map[err && err.message] || map.NETWORK;
    const el = document.getElementById("status");
    if (el) {
      el.innerHTML = '';
      el.style.color = '#FF4444';
      el.style.textShadow = '0 0 4px rgba(255, 68, 68, 0.6), 0 0 14px rgba(255, 68, 68, 0.35)';
      el.style.letterSpacing = '0.04em';
      el.style.textTransform = 'none';
      el.style.fontSize = '15px';
      el.textContent = msg;
    }
  };

  try {
    const params = new URLSearchParams(location.search);
    const blobURL = params.get("blob");
    const fragParams = new URLSearchParams(location.hash.slice(1));
    const keyB64u = fragParams.get("k");
    const ivB64u  = fragParams.get("iv");
    if (!blobURL || !keyB64u || !ivB64u) throw new Error("INCOMPLETE_LINK");

    const b64uToBytes = (s) => {
      const pad = "=".repeat((4 - s.length % 4) % 4);
      const b64 = (s + pad).replace(/-/g, "+").replace(/_/g, "/");
      const bin = atob(b64);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      return bytes;
    };

    let resp;
    try {
      resp = await fetch(blobURL);
    } catch {
      throw new Error("NETWORK");
    }
    if (!resp.ok) {
      if (resp.status === 404 || resp.status === 410) throw new Error("EXPIRED");
      throw new Error("NETWORK");
    }
    const ciphertext = new Uint8Array(await resp.arrayBuffer());

    const cryptoKey = await crypto.subtle.importKey(
      "raw", b64uToBytes(keyB64u), { name: "AES-GCM" }, false, ["decrypt"]
    );
    let plaintext;
    try {
      const buf = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: b64uToBytes(ivB64u) },
        cryptoKey,
        ciphertext
      );
      plaintext = new TextDecoder("utf-8").decode(buf);
    } catch {
      throw new Error("DECRYPT_FAILED");
    }

    const iframe = document.createElement("iframe");
    iframe.setAttribute("sandbox", "allow-scripts");
    iframe.srcdoc = plaintext;
    document.body.replaceChildren(iframe);
  } catch (err) {
    showError(err);
  }
})();
</script>
</body>
</html>
